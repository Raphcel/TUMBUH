services:
  backend:
    ports:
      - "8001:8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      CORS_ORIGINS: http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173
      FRONTEND_URL: http://localhost:8081

  frontend:
    ports:
      - "8081:80"
    build:
      args:
        VITE_API_URL: /api/v1

  audit-log:
    ports:
      - "3002:3001"
    environment:
      BACKEND_API_URL: http://localhost:8001/api/v1
